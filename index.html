let w="data";
if(a==="tab"){tab=v;cur=null;w=""}else if(a==="open"){cur=v;w=""}else if(a==="back"){cur=null;w=""}
else if(a==="pick"){checkout(v);return}
else if(a==="dec"){E.dec[dk()]=v==="ok"?t.adj.f:v==="keep"?1:v==="rest"?0:+$("#cv").value/100;cs()}
else if(a==="mode"){E.mode=v;w="mode"}
else if(a==="pf"){P[k]=k==="spw"?+v:v;cs()}
else if(a==="pch"){const i=P[k].indexOf(v);i>=0?P[k].splice(i,1):P[k].push(v);if(k==="st"||k==="wk"){const o=k==="st"?"wk":"st";if(P[k].includes(v))P[o]=P[o].filter(x=>x!==v)}cs()}
else if(a==="pev"){const i=P.evs.indexOf(v);if(i>=0){if(P.evs.length>1)P.evs.splice(i,1)}else{P.evs.push(v);if(P.evs.length>2)P.evs.shift()}P.ev=P.evs[0];cs()}
else if(a==="pvalid"){const g=id=>{const el=$("#"+id);return el?el.value:""};P.age=g("pf_age");P.h=g("pf_h");P.w=g("pf_w");P.stO=g("pf_stO");P.wkO=g("pf_wkO");P.injO=g("pf_injO");Object.keys(LN).forEach(z=>{P.rm[z]={w:g("rw"+z),r:g("rr"+z)}});
let m="";if(!(+P.age>=10&&+P.age<=80))m="Entre l’âge (10 à 80 ans).";else if(!(+P.h>=120&&+P.h<=230))m="Entre la taille en cm (120 à 230).";else if(!(+P.w>=30&&+P.w<=150))m="Entre le poids en kg (30 à 150).";else if(Object.keys(P.rm).some(z=>{const q=P.rm[z],a2=+q.w,r2=+q.r;return(q.w!==""||q.r!=="")&&!(a2>=10&&a2<=400&&Number.isInteger(r2)&&r2>=1&&r2<=10)}))m="Force : pour chaque exercice, entre une charge (10 à 400 kg) et des répétitions (1 à 10), ou laisse les deux champs vides.";
E.perr=m;if(!m){P.done=true;E.pok=true}cs()}
else if(a==="rm"){Object.keys(LN).forEach(z=>{P.rm[z]={w:$("#rw"+z).value,r:$("#rr"+z).value}});cs()}
else if(a==="add"){E.prog.push({d:1,t:"",x:""});cs()}
else if(a==="del"){E.prog.splice(+v,1);cs()}
else if(a==="imp"){const p=PR(t),bb=bfac(p);build(p).forEach(s=>E.prog.push({d:s.day,t:s.name,x:s.blocks.map(z=>z.t+" : "+fmt(sc(z.n,bb.f),z.u)+(z.l?lt(z,p):"")).join("\n")}));cs()}
else if(a==="send"){E.sent=true;cs()}
else if(a==="notes"){E.notes={obj:$("#n1").value,rec:$("#n2").value,att:$("#n3").value,priv:$("#n4").value};E.nok=true;w="notes"}
else if(a==="msg"){const x=$("#cm").value.trim();if(!x)return;E.msgs.push({f:"c",t:new Date().toISOString(),x});await persist(t.key,"msg",x);w=""}
else if(a==="copy"){try{navigator.clipboard.writeText(CODE);b.textContent="Code copié"}catch(x){b.textContent="Copie le code affiché"}return}
if(w)await persist(t?t.key:null,w);
cr();if(a==="tab"||a==="open"||a==="back")scrollTo(0,0)});
document.addEventListener("input",e=>{if(e.target.id==="cv")$("#cvl").textContent=e.target.value});
window.APX={start:async()=>{await loadCoach();cr()},refresh};
})();
</script>
<script>
/* ===== Plateforme : connexion, données, messages, paiement ===== */
const GX=document.getElementById("gate");
let sb=null,UID=null,PROF=null,LINK=null,SUB=null,AEMAIL="",GM="in",GA={role:"a",c1:false,c2:false},POLL=null,saveT=null;
const cfg=()=>{try{return JSON.parse(localStorage.getItem("apexcfg")||"{}")}catch(e){return{}}};
const errFr=m=>/Invalid login/i.test(m)?"E-mail ou mot de passe incorrect.":/not confirmed/i.test(m)?"Confirme d’abord ton e-mail (regarde ta boîte mail).":/already registered/i.test(m)?"Cet e-mail a déjà un compte. Connecte-toi.":/Password should/i.test(m)?"Le mot de passe est trop court (6 caractères minimum).":/rate limit|too many/i.test(m)?"Trop de demandes. Réessaie dans une heure.":m;
function gview(h){$("#ath").hidden=true;$("#coach").hidden=true;GX.hidden=false;GX.innerHTML=`<div class="top"><span class="brand">APEX SPRINT</span></div>`+h}
function cfgV(m){const c=cfg(),p=c.prices||{};gview(`<h1>Connexion à ta base de données</h1><p class="mut">Colle les deux informations de ton projet Supabase (Project Settings, puis API).</p><div class="card"><label class="f" style="margin-top:0">Project URL</label><input type="text" id="g_url" value="${esc(c.url||"")}" style="margin-top:0" placeholder="https://xxxx.supabase.co"><label class="f">Clé « anon public »</label><input type="text" id="g_key" value="${esc(c.key||"")}" style="margin-top:0"><details style="margin-top:12px"><summary>Paiement (facultatif)</summary><p class="mut">Identifiants de prix Stripe.</p>${[["p","Premium athlète"],["cs","Coach Starter"],["cp","Coach Pro"],["cc","Coach Club"]].map(([k,l])=>`<label class="f">${l}</label><input type="text" id="g_${k}" value="${esc(p[k]||"")}" style="margin-top:0" placeholder="price_...">`).join("")}</details><div class="err">${m||""}</div><button class="btn" data-x="savecfg">Enregistrer</button></div>`)}
function loginV(m){const up=GM==="up";gview(`<h1>${up?"Créer un compte":"Connexion"}</h1><div class="card">${up?`<label class="f" style="margin-top:0">Ton prénom</label><input type="text" id="g_name" style="margin-top:0" autocomplete="given-name">`:""}<label class="f"${up?"":' style="margin-top:0"'}>Adresse e-mail</label><input type="text" id="g_email" inputmode="email" autocomplete="email" style="margin-top:0"><label class="f">Mot de passe</label><input type="password" id="g_pw" autocomplete="${up?"new-password":"current-password"}" style="margin-top:0">${up?`<label class="f">Tu es</label><div class="row"><button type="button" class="seg ${GA.role==="a"?"on":""}" data-x="role" data-v="a">Athlète</button><button type="button" class="seg ${GA.role==="c"?"on":""}" data-x="role" data-v="c">Coach</button></div><button type="button" class="chip ${GA.c1?"on":""}" data-x="chk" data-v="c1" style="width:100%;text-align:left;border-radius:12px;margin-top:12px">J’accepte les conditions et la politique de confidentialité</button><button type="button" class="chip ${GA.c2?"on":""}" data-x="chk" data-v="c2" style="width:100%;text-align:left;border-radius:12px;margin-top:8px">J’accepte que mes données de santé (sommeil, douleur, forme) servent à mon suivi. Je peux retirer cet accord à tout moment.</button><details style="margin-top:12px"><summary>Lire la confidentialité</summary>${legalV(true)}</details>`:""}<div class="err" id="g_err">${m||""}</div><button class="btn" data-x="${up?"signup":"login"}">${up?"Créer mon compte":"Se connecter"}</button><button class="btn alt" data-x="mode">${up?"J’ai déjà un compte":"Créer un compte"}</button>${up?"":`<p class="mut" style="margin:12px 0 0"><a href="#" data-x="forgot">Mot de passe oublié ?</a></p>`}</div><p class="mut"><a href="#" data-x="resetcfg">Changer la base de données</a></p>`)}

const RECOV=/type=recovery/.test(location.hash);
function forgotV(m,ok){gview(`<h1>Mot de passe oublié</h1><div class="card">${ok?`<p>Si un compte existe avec cette adresse, un e-mail avec un lien vient d’être envoyé. Ouvre-le pour choisir un nouveau mot de passe.</p><p class="mut">Pense à regarder les courriers indésirables.</p><button class="btn" data-x="back">Retour à la connexion</button>`:`<label class="f" style="margin-top:0">Adresse e-mail</label><input type="text" id="g_email" inputmode="email" autocomplete="email" style="margin-top:0"><div class="err" id="g_err">${m||""}</div><button class="btn" data-x="fsend">Recevoir le lien</button><button class="btn alt" data-x="back">Retour</button>`}</div>`)}
function newpwV(m){gview(`<h1>Nouveau mot de passe</h1><div class="card"><label class="f" style="margin-top:0">Nouveau mot de passe</label><input type="password" id="g_pw" autocomplete="new-password" style="margin-top:0"><label class="f">Répète-le</label><input type="password" id="g_pw2" autocomplete="new-password" style="margin-top:0"><div class="err" id="g_err">${m||""}</div><button class="btn" data-x="newpw">Enregistrer</button></div>`)}
const subPlan=(s,coach)=>{if(!s||!/^(active|trialing)$/.test(s.status||""))return null;const m=coach?{coach_starter:"cs",coach_pro:"cp",coach_club:"cc"}:{premium:"p"};return m[s.plan]||null};
async function checkout(id){if(id==="g")return;const pid=(cfg().prices||{})[id];if(!pid){alert("Le paiement n’est pas encore configuré (identifiants de prix manquants).");return}const r=await sb.functions.invoke("create-checkout",{body:{priceId:pid}});if(r.error||!r.data||!r.data.url){alert("Impossible d’ouvrir le paiement.");return}location.href=r.data.url}
async function logout(){await sb.auth.signOut();location.reload()}
async function deleteAccount(){if(!confirm("Supprimer ton compte et toutes tes données ? Cette action est définitive."))return;const r=await sb.rpc("delete_my_account");if(r.error){alert("Suppression impossible : "+r.error.message);return}await sb.auth.signOut();location.reload()}
document.addEventListener("click",async e=>{const b=e.target.closest("[data-x]");if(!b)return;if(e.preventDefault)e.preventDefault();const x=b.dataset.x,v=b.dataset.v,g=id=>{const el=document.getElementById(id);return el?el.value.trim():""},er=m=>{const el=document.getElementById("g_err");if(el)el.textContent=m};
try{
if(x==="savecfg"){const url=g("g_url"),key=g("g_key");if(!/^https:\/\//.test(url)||key.length<20){cfgV("Vérifie l’adresse (https://…) et la clé.");return}const prices={};["p","cs","cp","cc"].forEach(k=>{if(g("g_"+k))prices[k]=g("g_"+k)});localStorage.setItem("apexcfg",JSON.stringify({url,key,prices}));location.reload()}
else if(x==="resetcfg"){cfgV()}
else if(x==="mode"){GM=GM==="in"?"up":"in";loginV()}
else if(x==="role"){GA.role=v;document.querySelectorAll("[data-x=role]").forEach(y=>y.classList.toggle("on",y.dataset.v===v))}
else if(x==="chk"){b.classList.toggle("on",GA[v]=!GA[v])}
else if(x==="login"){const r=await sb.auth.signInWithPassword({email:g("g_email"),password:document.getElementById("g_pw").value});if(r.error){er(errFr(r.error.message));return}await afterLogin(r.data.user)}
else if(x==="signup"){const name=g("g_name"),email=g("g_email"),pw=document.getElementById("g_pw").value;
if(!name){er("Entre ton prénom.");return}if(!/^\S+@\S+\.\S+$/.test(email)){er("Entre une adresse e-mail valide.");return}if(pw.length<6){er("Le mot de passe doit faire 6 caractères au moins.");return}
if(!GA.c1){er("Accepte les conditions et la confidentialité pour continuer.");return}if(!GA.c2){er("L’accord sur les données de santé est nécessaire pour le suivi.");return}
const r=await sb.auth.signUp({email,password:pw,options:{data:{role:GA.role==="c"?"coach":"athlete",name,health:"true"}}});if(r.error){er(errFr(r.error.message));return}
if(r.data.session)await afterLogin(r.data.user);else{GM="in";loginV("Compte créé. Confirme ton e-mail (regarde ta boîte mail), puis connecte-toi.")}}
else if(x==="forgot"){forgotV()}
else if(x==="back"){loginV()}
else if(x==="fsend"){const em=g("g_email");if(!/^\S+@\S+\.\S+$/.test(em)){er("Entre une adresse e-mail valide.");return}const r=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});if(r.error){er(errFr(r.error.message));return}forgotV("",true)}
else if(x==="newpw"){const a=document.getElementById("g_pw").value,b=document.getElementById("g_pw2").value;if(a.length<6){er("Le mot de passe doit faire 6 caractères au moins.");return}if(a!==b){er("Les deux mots de passe ne sont pas identiques.");return}const r=await sb.auth.updateUser({password:a});if(r.error){er(errFr(r.error.message));return}history.replaceState(null,"",location.pathname);const u=await sb.auth.getUser();await afterLogin(u.data.user)}
else if(x==="logout"){await logout()}
else if(x==="delacc"){await deleteAccount()}
}catch(err){er(err.message)}});
async function afterLogin(user){UID=user.id;AEMAIL=user.email||"";const p=await sb.from("profiles").select("*").eq("id",UID).maybeSingle();PROF=p.data;
if(!PROF){loginV("Profil introuvable. Le fichier schema.sql a-t-il bien été exécuté dans Supabase ?");return}
const sp=await sb.from("subscriptions").select("*").eq("user_id",UID).maybeSingle();SUB=sp.data||null;GX.hidden=true;
if(PROF.role==="coach"){$("#ath").hidden=true;$("#coach").hidden=false;S.planC=subPlan(SUB,true);await window.APX.start()}
else{await loadAthlete();$("#coach").hidden=true;$("#ath").hidden=false;render()}
clearInterval(POLL);POLL=setInterval(()=>{PROF.role==="coach"?window.APX.refresh():pollA()},7000)}
async function loadAthlete(){const ad=await sb.from("athlete_data").select("data").eq("athlete_id",UID).maybeSingle(),lk=await sb.from("coach_links").select("*").eq("athlete_id",UID).maybeSingle();
S=Object.assign({p:null,ck:{},me:{}},(ad.data&&ad.data.data)||{});S.ck=S.ck||{};S.me=S.me||{};S.acct={email:AEMAIL,role:"a"};LINK=lk.data||null;S.plan=subPlan(SUB,false)||"g";
await loadAthleteCoach();
if(LINK&&(!S.p||!S.p.coach))S.p={name:PROF.name,coach:true,ev:"100 m",ph:"spec",lv:"conf",spw:4,st:[],wk:[],inj:[],rm:{},start:dk()};
if(!LINK&&S.p&&S.p.coach)S.p=null}
async function loadAthleteCoach(){C={a:{}};const E=ent(ME);if(!LINK)return;
const cd=await sb.from("coach_data").select("data").eq("athlete_id",UID).maybeSingle(),d=(cd.data&&cd.data.data)||{},ms=await sb.from("messages").select("*").eq("athlete_id",UID).order("created_at",{ascending:true});
Object.assign(E,{prog:d.prog||[],sent:!!d.sent,mental:d.mental||{},prof:d.prof||null,dec:d.dec||{},mode:LINK.tool_mode,link:true,msgs:(ms.data||[]).map(m=>({f:m.sender_id===UID?"a":"c",t:m.created_at,x:m.body}))})}
function dbSave(){if(!sb||!UID||!PROF||PROF.role!=="athlete")return;clearTimeout(saveT);saveT=setTimeout(async()=>{const d=Object.assign({},S);delete d.acct;delete d.plan;const r=await sb.from("athlete_data").upsert({athlete_id:UID,data:d,updated_at:new Date().toISOString()});if(r.error)console.error(r.error)},500)}
async function pollA(){if(!LINK)return;const before=JSON.stringify(C.a[ME]);await loadAthleteCoach();if(JSON.stringify(C.a[ME])===before)return;
const ch=document.getElementById("chat");if(ch){ch.outerHTML=chat(ent(ME),"a");return}
const ae=document.activeElement;if(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))return;if(["today","plan","soir","coach"].includes(tab)&&!PL.on)render()}
async function joinCoach(code){const r=await sb.rpc("join_coach",{p_code:code});if(r.error){const el=$("#lke");if(el)el.textContent=/code inconnu/.test(r.error.message)?"Code inconnu. Vérifie-le auprès de ton coach.":r.error.message;return}
const lk=await sb.from("coach_links").select("*").eq("athlete_id",UID).maybeSingle();LINK=lk.data;await loadAthlete();path=null;tab="today";render()}
async function leaveCoach(){if(!confirm("Quitter ton coach ? Tu garderas tes données."))return;const r=await sb.rpc("leave_coach");if(r.error){alert(r.error.message);return}LINK=null;await loadAthlete();path=null;render()}
async function sendMsgA(x){if(!x||!LINK)return;const r=await sb.from("messages").insert({athlete_id:UID,coach_id:LINK.coach_id,sender_id:UID,body:x});if(r.error){alert("Message non envoyé : "+r.error.message);return}await loadAthleteCoach();render()}
async function boot(){const c=cfg();if(!c.url||!c.key){cfgV();return}
if(typeof supabase==="undefined"){gview(`<h1>Connexion impossible</h1><p class="mut">Le module de connexion n’a pas pu se charger. Vérifie ta connexion internet et recharge la page.</p>`);return}
sb=supabase.createClient(c.url,c.key);sb.auth.onAuthStateChange(ev=>{if(ev==="PASSWORD_RECOVERY")newpwV()});
const s=await sb.auth.getSession();
if(RECOV&&s.data&&s.data.session){newpwV();return}
if(s.data&&s.data.session)await afterLogin(s.data.session.user);else loginV()}
boot().catch(e=>gview(`<h1>Erreur</h1><p class="mut">${esc(e.message)}</p><button class="btn alt" data-x="resetcfg">Vérifier la configuration</button>`));
</script></body></html>
